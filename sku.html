<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f1ea;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        .nav {
            text-align: center;
            margin-bottom: 25px;
        }

        .nav a {
            text-decoration: none;
            color: white;
            background-color: #333;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .sku-box {
            margin-top: 20px;
            padding: 20px;
            background-color: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
        }

        #sku {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <a href="index.html">Receipt Generator</a>

    <h1>SKU Generator</h1>

   <label>Product Category:</label>
    <input type="text" id="category" placeholder="e.g. Perishables">
    <br>

    <label>Product Name:</label>
    <input type="text" id="product" placeholder="e.g. Water">
    <br>

    <label>Stock Quantity:</label>
    <input type="number" id="stock" placeholder="e.g. 50">
    <br><br>

    <button py-click="generate_sku">
        Generate SKU
    </button>

    <h2>SKU</h2>
    <p id="sku">Your SKU will appear here.</p>
    <div id="results"></div>

    <script type="py" src="sku.py"></script>

</body>
</html>
